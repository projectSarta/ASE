<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E7E8E6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#10152A" media="(prefers-color-scheme: dark)" />
<script>(function(){var d=document.documentElement,s=null,l=null;try{s=localStorage.getItem('ase_theme');l=localStorage.getItem('ase_lang');}catch(e){}
if(s)d.setAttribute('data-theme',s);
if(l!=='ar'&&l!=='en')l=/^ar/i.test(navigator.language||'')?'ar':'en';
d.lang=l;d.dir=l==='ar'?'rtl':'ltr';})();</script>
<title>ASE Live · Amman Stock Exchange</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="ASE Live" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #E7E8E6; --card: #F3F4F2; --line: #D4D6D2; --hair: #DEDFDB;
    --ink: #1E232B; --stone: #676C74; --night: #1B2A4A;
    --up: #17795E; --down: #B23A2E; --flat: #8A8F96;
    --up-bg: rgba(23,121,94,.12); --down-bg: rgba(178,58,46,.11);
    --font: "Archivo", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --font-exp: "Archivo Expanded", "Archivo", ui-sans-serif, system-ui, sans-serif;
    --font-ar: "IBM Plex Sans Arabic", var(--font);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #10152A; --card: #182138; --line: #28324E; --hair: #1A2340;
      --ink: #E9EAEE; --stone: #8B92A4; --night: #93A8E6;
      --up: #2EBE86; --down: #E7685C; --flat: #7E858D;
      --up-bg: rgba(46,190,134,.14); --down-bg: rgba(231,104,92,.13);
    }
  }
  :root[data-theme="dark"] {
    --paper: #10152A; --card: #182138; --line: #28324E; --hair: #1A2340;
    --ink: #E9EAEE; --stone: #8B92A4; --night: #93A8E6;
    --up: #2EBE86; --down: #E7685C; --flat: #7E858D;
    --up-bg: rgba(46,190,134,.14); --down-bg: rgba(231,104,92,.13);
  }
  :root[lang="ar"] { --font: "IBM Plex Sans Arabic", "Archivo", ui-sans-serif, system-ui, "Segoe UI", Tahoma, sans-serif; }
  :root[lang="ar"] .muted .big { font-family: var(--font-ar); }
  /* figures, symbols and prices always read left-to-right, even inside an RTL page */
  .ix-val, .ix-chg, .ix-meta .mv, .rw-sym, .rw-last, .rw-chg, .sh-sym, .q-price, .q-delta,
  .ohlc .v, .lvl .p, .lvl .q, .tape .tm, .tape .tp, .tape .tq, .wm, .rw-name, .sh-name { direction: ltr; unicode-bidi: isolate; }
  :root[dir="rtl"] .rw-name, :root[dir="rtl"] .sh-name { text-align: right; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.5 var(--font);
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .tnum { font-variant-numeric: tabular-nums; }
  .dir-up { color: var(--up); } .dir-down { color: var(--down); } .dir-flat { color: var(--flat); }

  /* ---- header / hero ---- */
  header { padding: calc(18px + env(safe-area-inset-top)) 20px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wm { color: var(--night); line-height: 1; display: inline-flex; align-items: baseline; gap: 6px; }
  .wm .a { font-family: var(--font-exp); font-weight: 700; font-size: 18px; letter-spacing: .02em; }
  .wm .b { font-family: var(--font); font-weight: 500; font-size: 16px; opacity: .78; }
  .brand .ar { font-family: var(--font-ar); font-weight: 500; font-size: 12.5px; color: var(--stone); }
  .status { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--stone); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--flat); }
  .status.open { color: var(--up); }
  .status.open .dot { background: var(--up); animation: pulse 2.6s ease-in-out infinite; }
  .hbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; margin-block: -12px; padding: 0; background: none; border: 0; cursor: pointer; color: var(--stone); border-radius: 10px; font: 600 14px var(--font); }
  .hbtn:hover { color: var(--ink); }
  .hbtn svg { width: 18px; height: 18px; display: block; }
  .theme-tog { margin-inline-end: -13px; }
  :focus-visible { outline: 2px solid var(--night); outline-offset: 2px; border-radius: 4px; }

  .hero { padding: 22px 0 18px; }
  .ix-label { font-size: 13px; color: var(--stone); }
  .ix-row { display: flex; align-items: baseline; gap: 14px; margin-top: 3px; flex-wrap: wrap; }
  .ix-val { font-family: var(--font-exp); font-weight: 700; font-size: 46px; line-height: .95; letter-spacing: -.015em; color: var(--night); font-variant-numeric: tabular-nums; }
  .ix-chg { display: inline-flex; align-items: baseline; gap: 10px; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  .ix-chg .tri { font-size: 11px; margin-inline-end: 4px; }
  .ix-meta { display: flex; gap: 20px; margin-top: 14px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ix-meta .ml { color: var(--stone); }
  .ix-meta .mv { color: var(--ink); font-weight: 500; }
  .feednote { margin-top: 10px; font-size: 12px; color: var(--ink); }
  .feednote.stale { color: var(--down); font-weight: 500; }
  .idxspark { margin-top: 14px; height: 40px; }
  .idxspark svg { width: 100%; height: 40px; display: block; }

  /* ---- live ticker tape ---- */
  .tape-strip { position: sticky; top: 0; z-index: 6; overflow: hidden; background: var(--card); border-bottom: 1px solid var(--line); }
  .tape-track { display: inline-flex; white-space: nowrap; direction: ltr; will-change: transform; animation: tape 150s linear infinite; }
  .tape-strip:hover .tape-track { animation-play-state: paused; }
  .tk { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 14px; font-size: 12px; font-variant-numeric: tabular-nums; border-inline-end: 1px solid var(--hair); }
  .tk b { font-weight: 700; color: var(--ink); }
  .tk .tkp { color: var(--stone); }
  .tk .tkc { font-weight: 600; }
  @keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ---- controls ---- */
  .search { width: calc(100% - 40px); margin: 4px 20px 14px; display: block; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 400 16px var(--font); outline: none; }
  .search::placeholder { color: var(--stone); }
  .search:focus { border-color: var(--night); }
  .tabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; padding: 0 20px; border-bottom: 1px solid var(--hair); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; background: none; border: 0; cursor: pointer; padding: 6px 0 12px; margin: 0 0 -1px; color: var(--stone); font: 500 14px var(--font); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--ink); border-bottom-color: var(--night); }

  /* ---- list ---- */
  ul { list-style: none; margin: 0; padding: 4px 0 0; }
  .row { display: flex; align-items: center; padding-inline-start: 8px; border-bottom: 1px solid var(--hair); }
  .rw-open { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; padding-block: 13px; padding-inline: 6px 20px; background: none; border: 0; font: inherit; color: inherit; text-align: start; cursor: pointer; }
  .rw-open:active { background: var(--card); }
  .star { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; padding: 0; background: none; border: 0; cursor: pointer; color: var(--stone); border-radius: 10px; }
  .star svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
  .star.on { color: #C9932B; }
  .star.on svg { fill: currentColor; }
  .rw-id { display: block; min-width: 0; }
  .rw-sym { font-weight: 600; font-size: 15px; color: var(--ink); }
  .rw-name { display: block; color: var(--stone); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
  .rw-last { font-weight: 600; font-size: 15px; color: var(--ink); text-align: end; font-variant-numeric: tabular-nums; }
  .rw-chg { font-weight: 600; font-size: 13px; text-align: end; min-width: 76px; font-variant-numeric: tabular-nums; }
  .rw-chg .tri { font-size: 9px; margin-inline-end: 4px; }

  .flash-up { animation: fUp 1s ease-out; } .flash-down { animation: fDn 1s ease-out; }
  @keyframes fUp { from { background: var(--up-bg); } to { background: transparent; } }
  @keyframes fDn { from { background: var(--down-bg); } to { background: transparent; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .muted { color: var(--stone); text-align: center; padding: 44px 28px; font-size: 14px; line-height: 1.6; }
  .muted.err { color: var(--down); }
  .muted .big { display: block; color: var(--ink); font-family: var(--font-exp); font-weight: 600; font-size: 17px; margin-bottom: 8px; }

  /* ---- detail sheet ---- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(14,18,30,.46); z-index: 20; display: none; }
  .sheet-bg.show { display: block; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 90vh; max-height: 90dvh; overflow: auto; outline: none; overscroll-behavior: contain; background: var(--paper); border-radius: 20px 20px 0 0; padding: 12px 20px calc(28px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .3s cubic-bezier(.22,.61,.36,1); }
  .sheet-bg.show .sheet { transform: translateY(0); }
  .grab { width: 36px; height: 4px; background: var(--line); border-radius: 99px; margin: 0 auto 16px; }
  .sh-head { display: flex; align-items: center; gap: 10px; }
  .sh-star { margin-inline-start: -10px; }
  .sh-close { margin-block: 0; margin-inline: auto -13px; }
  body.sheet-open { overflow: hidden; }
  .sh-sym { font-family: var(--font-exp); font-weight: 700; font-size: 22px; color: var(--ink); }
  .sh-name { color: var(--stone); font-size: 13px; margin: 4px 0 16px; }
  .q-now { display: flex; align-items: baseline; gap: 12px; }
  .q-price { font-family: var(--font-exp); font-weight: 700; font-size: 38px; line-height: 1; color: var(--night); font-variant-numeric: tabular-nums; }
  .q-delta { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }

  .ohlc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 18px; margin: 18px 0 4px; }
  .ohlc .cell { padding: 2px 0; }
  .ohlc .k { display: block; font-size: 12px; color: var(--stone); }
  .ohlc .v { display: block; font-weight: 600; font-size: 16px; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .chartwrap { margin: 18px 0 4px; direction: ltr; }
  .chartcap span { unicode-bidi: plaintext; }
  .spark { width: 100%; height: 108px; display: block; }
  .chartcap { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--stone); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .seclabel { font-size: 13px; color: var(--stone); margin: 22px 0 10px; }
  .ladder { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ladder .lh { font-size: 12px; color: var(--stone); margin-bottom: 6px; }
  .lvl { position: relative; display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 9px; margin: 3px 0; border-radius: 7px; overflow: hidden; font-variant-numeric: tabular-nums; }
  .lvl > span { position: relative; z-index: 1; }
  .lvl::before { content: ""; position: absolute; top: 0; bottom: 0; z-index: 0; }
  .lvl.bid::before { inset-inline-end: 0; width: var(--f, 0%); background: var(--up-bg); }
  .lvl.ask::before { inset-inline-start: 0; width: var(--f, 0%); background: var(--down-bg); }
  .lvl.bid .p { color: var(--up); font-weight: 600; } .lvl.ask .p { color: var(--down); font-weight: 600; }
  .lvl .q { color: var(--stone); }

  .tape .tr { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: baseline; font-size: 13px; padding: 7px 2px; border-bottom: 1px solid var(--hair); font-variant-numeric: tabular-nums; }
  .tape .tm { color: var(--stone); font-size: 12px; }
  .tape .tp { font-weight: 600; } .tape .tp.dir-up { color: var(--up); } .tape .tp.dir-down { color: var(--down); } .tape .tp.dir-flat { color: var(--ink); }
  .tape .tq { color: var(--stone); }

  @media (prefers-reduced-motion: reduce) { *, .sheet { animation: none !important; transition: none !important; } .tape-strip { overflow-x: auto; } }
</style>
</head>
<body>
<div class="tape-strip" id="tapeStrip" aria-hidden="true" style="display:none"><div class="tape-track" id="tapeTrack"></div></div>
<header>
  <div class="brand">
    <span class="wm"><span class="a">ASE</span><span class="b">Live</span></span>
    <span class="ar">بورصة عمّان</span>
    <span class="status" id="mktStatus"><span class="dot"></span><span class="lbl">—</span></span>
    <button class="hbtn" id="langTog" type="button"></button>
    <button class="hbtn theme-tog" id="themeTog" aria-label="Switch theme" type="button"></button>
  </div>
  <div class="hero">
    <div class="ix-label" data-i18n="idxLabel">ASE General Index</div>
    <div class="ix-row">
      <span class="ix-val" id="idxVal">—</span>
      <span class="ix-chg" id="idxChg"></span>
    </div>
    <div class="ix-meta" id="idxMeta"></div>
    <div class="idxspark" id="idxSpark" aria-hidden="true"></div>
    <div class="feednote" id="feedNote" role="status"></div>
  </div>
</header>
<input class="search" id="q" type="search" data-i18n-ph="search" data-i18n-aria="search" autocomplete="off" enterkeyhint="search" />
<nav class="tabs" id="tabs" data-i18n-aria="tabsLabel">
  <button class="tab on" data-t="all" aria-pressed="true" data-i18n="all">All</button>
  <button class="tab" data-t="watch" aria-pressed="false" data-i18n="watch">Watch</button>
  <button class="tab" data-t="gainers" aria-pressed="false" data-i18n="gainers">Gainers</button>
  <button class="tab" data-t="losers" aria-pressed="false" data-i18n="losers">Losers</button>
  <button class="tab" data-t="active" aria-pressed="false" data-i18n="active">Active</button>
</nav>

<ul id="list"><li class="muted">Loading prices…</li></ul>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" tabindex="-1"></div></div>

<script>
// Worker build — the UI talks to the local proxy (/api/*), which fetches the
// public ASELive JSONP endpoints and returns them as clean JSON. Same UI as the
// static Pages build; only the data layer differs (fetch JSON vs. JSONP).
const $ = (s) => document.querySelector(s);

// --- guarded storage: private mode / blocked / corrupt values must never stop the app
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
// feed strings are untrusted: escape before they touch innerHTML
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// --- language (English / Arabic) -------------------------------------------
const I18N = {
  en: {
    open: 'Market open', closed: 'Market closed', prevClose: 'Previous close', vol: 'Vol', val: 'Val', trades: 'Trades',
    idxLabel: 'ASE General Index', search: 'Search a symbol or company', tabsLabel: 'Market view',
    all: 'All', watch: 'Watch', gainers: 'Gainers', losers: 'Losers', active: 'Active',
    loading: 'Loading prices…', watchEmpty: 'No symbols yet. Tap the star on any row to follow it.', noMatch: 'No matches.',
    closedBody: 'The Amman Stock Exchange isn’t publishing live prices right now. Trading runs Sunday to Thursday — prices return here on their own when it reopens.',
    feedErr: 'Couldn’t reach the exchange feed. Retrying…',
    follow: 'Follow {s}', unfollow: 'Unfollow {s}', close: 'Close', toLight: 'Switch to light theme', toDark: 'Switch to dark theme',
    o: 'Open', h: 'High', l: 'Low', p: 'Prev', book: 'Order book', bid: 'Bid', ask: 'Ask', recent: 'Recent trades',
    noIntraday: 'No intraday trades yet.', noTrades: 'No trades yet.', loadingOne: 'Loading…',
    sheetErr: 'Couldn’t load this symbol. Close and try again.', chart: 'Intraday price chart', prevCap: 'prev close',
    note: 'Delayed data · Source: ASELive · updated {t}', noteWait: 'Delayed data · Source: ASELive',
    noteBad: 'Feed unreachable · last updated {t}', noteBadNone: 'Feed unreachable',
    agoLive: 'just now', agoSec: '{s}s ago', agoMin: '{m}m ago',
  },
  ar: {
    open: 'السوق مفتوح', closed: 'السوق مغلق', prevClose: 'الإغلاق السابق', vol: 'الحجم', val: 'القيمة', trades: 'الصفقات',
    idxLabel: 'المؤشر العام لبورصة عمّان', search: 'ابحث عن رمز أو شركة', tabsLabel: 'عرض السوق',
    all: 'الكل', watch: 'المتابعة', gainers: 'الأكثر ارتفاعاً', losers: 'الأكثر انخفاضاً', active: 'الأكثر تداولاً',
    loading: 'جارٍ تحميل الأسعار…', watchEmpty: 'لا توجد رموز بعد. اضغط على النجمة بجانب أي رمز لمتابعته.', noMatch: 'لا توجد نتائج.',
    closedBody: 'بورصة عمّان لا تنشر أسعاراً مباشرة حالياً. التداول من الأحد إلى الخميس، وستعود الأسعار هنا تلقائياً عند إعادة الفتح.',
    feedErr: 'تعذّر الاتصال بمصدر بيانات البورصة. جارٍ إعادة المحاولة…',
    follow: 'متابعة {s}', unfollow: 'إلغاء متابعة {s}', close: 'إغلاق', toLight: 'التبديل إلى الوضع الفاتح', toDark: 'التبديل إلى الوضع الداكن',
    o: 'الافتتاح', h: 'الأعلى', l: 'الأدنى', p: 'السابق', book: 'دفتر الأوامر', bid: 'الطلب', ask: 'العرض', recent: 'آخر الصفقات',
    noIntraday: 'لا توجد صفقات خلال اليوم بعد.', noTrades: 'لا توجد صفقات بعد.', loadingOne: 'جارٍ التحميل…',
    sheetErr: 'تعذّر تحميل هذا الرمز. أغلق النافذة وحاول مجدداً.', chart: 'الرسم البياني للسعر خلال اليوم', prevCap: 'الإغلاق السابق',
    note: 'بيانات متأخرة · المصدر: ASELive · التحديث {t}', noteWait: 'بيانات متأخرة · المصدر: ASELive',
    noteBad: 'تعذّر الوصول إلى المصدر · آخر تحديث {t}', noteBadNone: 'تعذّر الوصول إلى المصدر',
    agoLive: 'الآن', agoSec: 'قبل {s} ث', agoMin: 'قبل {m} د',
  },
};
let lang = (() => { const v = lsGet('ase_lang'); return v === 'ar' || v === 'en' ? v : (/^ar/i.test(navigator.language || '') ? 'ar' : 'en'); })();
const L = (k, v) => { let out = I18N[lang][k] != null ? I18N[lang][k] : (I18N.en[k] != null ? I18N.en[k] : k); if (v) for (const n in v) out = out.split('{' + n + '}').join(v[n]); return out; };

// --- theme toggle (system default, explicit choice persisted) --------------
const THEME_KEY = 'ase_theme';
const sunSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"/></svg>';
const moonSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8 8 0 0 1 9.6 4 6.5 6.5 0 1 0 20 14.4Z"/></svg>';
const effectiveTheme = () => document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function paintTheme() {
  const dark = effectiveTheme() === 'dark';
  const btn = document.getElementById('themeTog');
  if (btn) { btn.innerHTML = dark ? sunSVG : moonSVG; btn.setAttribute('aria-label', L(dark ? 'toLight' : 'toDark')); }
  let tc = document.getElementById('tc');
  if (!tc) { tc = document.createElement('meta'); tc.name = 'theme-color'; tc.id = 'tc'; document.head.appendChild(tc); }
  tc.setAttribute('content', dark ? '#10152A' : '#E7E8E6');
}
function toggleTheme() {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  lsSet(THEME_KEY, next);
  paintTheme();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!lsGet(THEME_KEY)) paintTheme(); });
let tab = 'all', allRows = [], listData = [], query = '';
let watch = new Set((() => { try { const a = JSON.parse(lsGet('ase_watch') || '[]'); return Array.isArray(a) ? a.filter((x) => typeof x === 'string') : []; } catch (e) { return []; } })());
let loaded = false;
let lastPx = {}, flashSet = null, marketClosed = false;
let idxSeries = [], idxDisplayed = null, idxRaf = 0, tapeBuilt = false;
const saveWatch = () => lsSet('ase_watch', JSON.stringify([...watch]));
function toggleWatch(sym) {
  if (watch.has(sym)) watch.delete(sym); else watch.add(sym);
  saveWatch();
  if (tab === 'watch') loadList(); else render();
}

const fmt = (n, d = 2) => (n == null ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }));
const dir = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : 'flat');
const sign = (n) => (n == null ? '' : (n > 0 ? '+' : '') + fmt(n, 2) + '%');
const tri = (n) => (n > 0 ? '▲' : n < 0 ? '▼' : '·');

// --- data access: the Worker proxy returns already-shaped JSON --------------
async function getJson(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

// --- index (tweened value + live sparkline) --------------------------------
let statusOpen = null, idx = null;
function setStatus(open) {
  statusOpen = open;
  const el = $('#mktStatus'); if (!el) return;
  el.className = 'status' + (open == null ? '' : open ? ' open' : ' closed');
  el.querySelector('.lbl').textContent = open == null ? '—' : L(open ? 'open' : 'closed');
}
// tween the index from its last shown value to the new one on every update
function setIndexValue(v) {
  const el = $('#idxVal');
  cancelAnimationFrame(idxRaf);
  if (v == null) { el.textContent = fmt(v); idxDisplayed = null; return; }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const from = idxDisplayed == null ? 0 : idxDisplayed;
  if (reduce || from === v) { el.textContent = fmt(v); idxDisplayed = v; return; }
  const dur = idxDisplayed == null ? 750 : 450, t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (v - from) * e);
    if (k < 1) idxRaf = requestAnimationFrame(step); else { el.textContent = fmt(v); idxDisplayed = v; }
  })(t0);
}
// index sparkline built live from each poll (session-only series)
function miniSpark(vals, d) {
  const el = $('#idxSpark'); if (!el) return;
  if (!vals || vals.length < 2) { el.innerHTML = ''; return; }
  const W = 320, H = 40, pad = 4;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const X = (i) => (i / (vals.length - 1)) * W;
  const Y = (v) => H - pad - ((v - lo) / span) * (H - 2 * pad);
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const col = d > 0 ? 'var(--up)' : d < 0 ? 'var(--down)' : 'var(--flat)';
  const ex = X(vals.length - 1).toFixed(1), ey = Y(vals[vals.length - 1]).toFixed(1);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="M${X(0)},${H} L${pts.join(' L')} L${ex},${H} Z" fill="${col}" opacity=".10"/>
    <path d="M${pts.join(' L')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${ex}" cy="${ey}" r="2.6" fill="${col}"/></svg>`;
}
// scrolling ticker tape — built once, values updated in place so the scroll never jumps
function renderTape(rows) {
  const strip = $('#tapeStrip'), track = $('#tapeTrack'); if (!track) return;
  const items = rows.filter((r) => r.last != null);
  if (!items.length) { strip.style.display = 'none'; return; }
  strip.style.display = '';
  if (!tapeBuilt) {
    const html = items.map((r) => `<span class="tk" data-tsym="${esc(r.sym)}"><b>${esc(r.sym)}</b><span class="tkp">${fmt(r.last)}</span><span class="tkc dir-${dir(r.chg)}">${tri(r.chg)} ${sign(r.chg)}</span></span>`).join('');
    track.innerHTML = html + html; // two copies → seamless loop
    tapeBuilt = true; return;
  }
  for (const r of items) {
    track.querySelectorAll('[data-tsym="' + CSS.escape(r.sym) + '"]').forEach((el) => {
      el.querySelector('.tkp').textContent = fmt(r.last);
      const c = el.querySelector('.tkc'); c.textContent = tri(r.chg) + ' ' + sign(r.chg); c.className = 'tkc dir-' + dir(r.chg);
    });
  }
}
async function loadTape() {
  try {
    const d = await getJson('/api/ticker');
    renderTape((d.rows || []).map((r) => ({ sym: r.sym, last: r.last, chg: r.chg })));
  } catch (e) {}
}
// everything language-dependent in the index block lives here so a language switch can repaint it
function renderIndex() {
  if (!idx) return;
  if (idx.value == null) {
    $('#idxChg').className = 'ix-chg'; $('#idxChg').innerHTML = '';
    $('#idxMeta').innerHTML = idx.prev != null ? `<span class="ml">${esc(L('prevClose'))}</span>` : '';
    return;
  }
  $('#idxChg').className = 'ix-chg dir-' + dir(idx.chg);
  $('#idxChg').innerHTML = `<span class="tri" aria-hidden="true">${tri(idx.chg)}</span>${idx.chg > 0 ? '+' : ''}${fmt(idx.pts)}<span>${sign(idx.chg)}</span>`;
  $('#idxMeta').innerHTML =
    `<span><span class="ml">${esc(L('vol'))}</span> <span class="mv">${fmt(idx.vol,0)}</span></span>` +
    `<span><span class="ml">${esc(L('val'))}</span> <span class="mv">${fmt(idx.val,0)}</span></span>` +
    `<span><span class="ml">${esc(L('trades'))}</span> <span class="mv">${fmt(idx.trd,0)}</span></span>`;
}

// --- feed disclosure: every figure is delayed ASELive data; say when we last got it
const feed = { idx: { ok: null, bad: false }, list: { ok: null, bad: false } };
function feedMark(k, ok) { feed[k].bad = !ok; if (ok) feed[k].ok = new Date(); renderNote(); }
function relAge(d) {
  const s = Math.max(0, Math.round((Date.now() - d) / 1000));
  if (s <= 1) return L('agoLive');
  if (s < 60) return L('agoSec', { s });
  return L('agoMin', { m: Math.floor(s / 60) });
}
function renderNote() {
  const el = $('#feedNote'); if (!el) return;
  const bad = feed.idx.bad || feed.list.bad;
  const last = [feed.idx.ok, feed.list.ok].filter(Boolean).sort((x, y) => y - x)[0];
  const tm = last ? esc(relAge(last)) : '';
  el.className = 'feednote' + (bad ? ' stale' : '');
  const tpl = bad ? (last ? L('noteBad', { t: '\u0001' }) : L('noteBadNone')) : (last ? L('note', { t: '\u0001' }) : L('noteWait'));
  el.innerHTML = esc(tpl).replace('\u0001', tm);
}

async function loadIndex() {
  try {
    const i = await getJson('/api/index');
    feedMark('idx', true);
    const value = i.value, chg = i.changePct, pts = i.changePts, prev = i.prevClose;
    if (value == null) {
      setStatus(false);
      idx = { value: null, prev };
      $('#idxVal').textContent = prev != null ? fmt(prev) : '—';
      idxDisplayed = prev != null ? prev : null;
      miniSpark([], 0);
      renderIndex();
      return;
    }
    setStatus(true);
    setIndexValue(value);
    idxSeries.push(value); if (idxSeries.length > 120) idxSeries.shift();
    miniSpark(idxSeries, chg);
    idx = { value, chg, pts, prev, vol: i.volume, val: i.turnover, trd: i.trades };
    renderIndex();
  } catch (e) { feedMark('idx', false); }
}

async function loadList() {
  try {
    if (tab === 'all' || tab === 'watch') {
      const d = await getJson('/api/ticker');
      allRows = (d.rows || []).filter((r) => r.last != null);
      renderTape(allRows);
      listData = tab === 'watch' ? allRows.filter((r) => watch.has(r.sym)) : allRows;
    } else {
      const d = await getJson('/api/' + tab);
      listData = (d || []).map((r) => ({ sym: r.sym, name: r.name, last: r.price, chg: r.chg }));
    }
    marketClosed = (tab === 'all' || tab === 'watch') ? allRows.length === 0 : listData.length === 0;
    flashSet = {};
    for (const r of listData) { if (lastPx[r.sym] != null && lastPx[r.sym] !== r.last) flashSet[r.sym] = r.last > lastPx[r.sym] ? 'up' : 'down'; lastPx[r.sym] = r.last; }
    loaded = true; feedMark('list', true);
    render();
  } catch (e) {
    feedMark('list', false);
    if (!loaded) $('#list').innerHTML = `<li class="muted err">${esc(L('feedErr'))}</li>`;
  }
}

function closedPanel() {
  return `<li class="muted"><span class="big">${esc(L('closed'))}</span>${esc(L('closedBody'))}</li>`;
}

const starSVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1L3.2 9.6l6.1-.8z"/></svg>';
const closeSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

// rows are rebuilt on every poll; keep keyboard focus on the same control across rebuilds
function render() {
  const list = $('#list'), a = document.activeElement;
  const keep = a && list.contains(a) ? (a.dataset.star ? ['star', a.dataset.star] : a.dataset.open ? ['open', a.dataset.open] : null) : null;
  renderRows();
  if (keep) { const n = list.querySelector('[data-' + keep[0] + '="' + CSS.escape(keep[1]) + '"]'); if (n) n.focus({ preventScroll: true }); }
}
function renderRows() {
  const q = query.toLowerCase();
  const rows = listData.filter((r) => !q || r.sym.toLowerCase().includes(q) || (r.name || '').toLowerCase().includes(q));
  if (!rows.length) {
    if (marketClosed && !q) { $('#list').innerHTML = closedPanel(); flashSet = null; return; }
    $('#list').innerHTML = `<li class="muted">${esc(tab === 'watch' && !q ? L('watchEmpty') : L('noMatch'))}</li>`;
    flashSet = null; return;
  }
  const fl = flashSet || {};
  $('#list').innerHTML = rows.map((r) => {
    const f = fl[r.sym] ? ` flash-${fl[r.sym]}` : '';
    const sy = esc(r.sym), on = watch.has(r.sym);
    return `<li class="row${f}">
      <button type="button" class="star${on ? ' on' : ''}" data-star="${sy}" aria-pressed="${on}" aria-label="${esc(L(on ? 'unfollow' : 'follow', { s: r.sym }))}">${starSVG}</button>
      <button type="button" class="rw-open" data-open="${sy}">
        <span class="rw-id"><span class="rw-sym">${sy}</span>${r.name ? `<span class="rw-name">${esc(r.name)}</span>` : ''}</span>
        <span class="rw-last">${fmt(r.last)}</span>
        <span class="rw-chg dir-${dir(r.chg)}"><span class="tri" aria-hidden="true">${tri(r.chg)}</span>${sign(r.chg)}</span>
      </button>
    </li>`;
  }).join('');
  flashSet = null;
}

// --- intraday sparkline ----------------------------------------------------
function buildChart(prices, prevClose, d) {
  if (!prices || prices.length < 2) return `<div class="muted" style="padding:24px">${esc(L('noIntraday'))}</div>`;
  const W = 320, H = 108, pad = 12;
  const lo = Math.min(...prices, prevClose), hi = Math.max(...prices, prevClose);
  const span = (hi - lo) || 1;
  const X = (i) => (i / (prices.length - 1)) * W;
  const Y = (v) => H - pad - ((v - lo) / span) * (H - 2 * pad);
  const pts = prices.map((p, i) => `${X(i).toFixed(1)},${Y(p).toFixed(1)}`);
  const baseY = Y(prevClose).toFixed(1);
  const col = d > 0 ? 'var(--up)' : d < 0 ? 'var(--down)' : 'var(--flat)';
  const ex = X(prices.length - 1).toFixed(1), ey = Y(prices[prices.length - 1]).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(L('chart'))}">
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="var(--stone)" stroke-width="1" stroke-dasharray="3 4" opacity=".5" vector-effect="non-scaling-stroke"/>
    <path d="M${X(0)},${H} L${pts.join(' L')} L${ex},${H} Z" fill="${col}" opacity=".12"/>
    <path d="M${pts.join(' L')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${ex}" cy="${ey}" r="3.4" fill="${col}"/>
  </svg>`;
}

// --- detail sheet ----------------------------------------------------------
let sheetSym = null;
const closeBtn = () => `<button type="button" class="hbtn sh-close" data-close aria-label="${esc(L('close'))}">${closeSVG}</button>`;
function closeSheet() {
  $('#sheetBg').classList.remove('show');
  document.body.classList.remove('sheet-open');
  const n = sheetSym && $('#list').querySelector('[data-open="' + CSS.escape(sheetSym) + '"]');
  sheetSym = null;
  if (n) n.focus({ preventScroll: true });
}
async function openSheet(sym) {
  sheetSym = sym;
  $('#sheetBg').classList.add('show');
  document.body.classList.add('sheet-open');
  const sheet = $('#sheet');
  sheet.innerHTML = `<div class="grab"></div><div class="sh-head"><span class="sh-sym" id="shTitle">${esc(sym)}</span>${closeBtn()}</div><div class="sh-name">${esc(L('loadingOne'))}</div>`;
  sheet.scrollTop = 0; sheet.focus({ preventScroll: true });
  try {
    const [q, dp, ia] = await Promise.all([
      getJson('/api/quote?symbol=' + encodeURIComponent(sym)),
      getJson('/api/depth?symbol=' + encodeURIComponent(sym)),
      getJson('/api/intraday?symbol=' + encodeURIComponent(sym)),
    ]);
    if (sheetSym !== sym) return;
    const ask = (dp.ask || []).filter((l) => l.price != null);
    const bid = (dp.bid || []).filter((l) => l.price != null);
    const maxQ = Math.max(1, ...ask.map((l) => l.qty || 0), ...bid.map((l) => l.qty || 0));
    const trades = ia.trades || [];
    const dd = q.changePct;
    const bar = (l, side) => `<div class="lvl ${side}" style="--f:${((l.qty || 0) / maxQ * 100).toFixed(0)}%"><span class="p">${fmt(l.price)}</span><span class="q">${fmt(l.qty,0)}</span></div>`;
    const bids = bid.map((l) => bar(l, 'bid')).join('') || '<div class="muted" style="padding:12px">—</div>';
    const asks = ask.map((l) => bar(l, 'ask')).join('') || '<div class="muted" style="padding:12px">—</div>';
    const tapeHtml = trades.length
      ? trades.map((t) => `<div class="tr"><span class="tm">${esc(t.time)}</span><span class="tp dir-${dir(q.prevClose != null ? t.price - q.prevClose : 0)}">${fmt(t.price)}</span><span class="tq">${fmt(t.qty,0)}</span></div>`).join('')
      : `<div class="muted" style="padding:16px">${esc(L('noTrades'))}</div>`;
    const chrono = trades.map((t) => t.price).filter(Number.isFinite).reverse();
    const on = watch.has(sym);

    sheet.innerHTML = `
      <div class="grab"></div>
      <div class="sh-head">
        <button type="button" class="star sh-star${on ? ' on' : ''}" data-sheetstar="${esc(sym)}" aria-pressed="${on}" aria-label="${esc(L(on ? 'unfollow' : 'follow', { s: sym }))}">${starSVG}</button>
        <span class="sh-sym" id="shTitle">${esc(sym)}</span>
        ${closeBtn()}
      </div>
      <div class="sh-name">${esc(q.name || '')}</div>
      <div class="q-now">
        <span class="q-price">${fmt(q.current)}</span>
        <span class="q-delta dir-${dir(dd)}">${q.change != null ? (dd > 0 ? '+' : '') + fmt(q.change) : ''} ${dd != null ? sign(dd) : ''}</span>
      </div>
      <div class="ohlc">
        <div class="cell"><span class="k">${esc(L('o'))}</span><span class="v">${fmt(q.open)}</span></div>
        <div class="cell"><span class="k">${esc(L('h'))}</span><span class="v dir-up">${fmt(q.high)}</span></div>
        <div class="cell"><span class="k">${esc(L('l'))}</span><span class="v dir-down">${fmt(q.low)}</span></div>
        <div class="cell"><span class="k">${esc(L('p'))}</span><span class="v">${fmt(q.prevClose)}</span></div>
      </div>
      <div class="chartwrap">
        ${buildChart(chrono, q.prevClose, dd)}
        <div class="chartcap"><span>${trades.length ? esc(trades[trades.length - 1].time) : ''}</span><span>${esc(L('prevCap'))} ${fmt(q.prevClose)}</span><span>${trades.length ? esc(trades[0].time) : ''}</span></div>
      </div>
      <div class="seclabel">${esc(L('book'))}</div>
      <div class="ladder">
        <div><div class="lh">${esc(L('bid'))}</div>${bids}</div>
        <div><div class="lh">${esc(L('ask'))}</div>${asks}</div>
      </div>
      <div class="seclabel">${esc(L('recent'))}</div>
      <div class="tape">${tapeHtml}</div>`;
  } catch (e) {
    if (sheetSym !== sym) return;
    sheet.innerHTML = `<div class="grab"></div><div class="sh-head"><span class="sh-sym" id="shTitle">${esc(sym)}</span>${closeBtn()}</div><div class="sh-name" style="color:var(--down)">${esc(L('sheetErr'))}</div>`;
  }
}

// --- events ----------------------------------------------------------------
$('#tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach((x) => { x.classList.toggle('on', x === t); x.setAttribute('aria-pressed', x === t ? 'true' : 'false'); });
  tab = t.dataset.t; lastPx = {}; loadList();
});
$('#q').addEventListener('input', (e) => { query = e.target.value; render(); });
$('#list').addEventListener('click', (e) => {
  const star = e.target.closest('.star');
  if (star) { toggleWatch(star.dataset.star); return; }
  const r = e.target.closest('.rw-open'); if (r) openSheet(r.dataset.open);
});
$('#sheetBg').addEventListener('click', (e) => { if (e.target.id === 'sheetBg') closeSheet(); });
$('#sheet').addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  const s = e.target.closest('[data-sheetstar]'); if (!s) return;
  const sym = s.dataset.sheetstar;
  toggleWatch(sym);
  const on = watch.has(sym);
  s.classList.toggle('on', on); s.setAttribute('aria-pressed', on);
  s.setAttribute('aria-label', L(on ? 'unfollow' : 'follow', { s: sym }));
});
// modal behaviour: Escape closes, Tab stays inside the sheet
document.addEventListener('keydown', (e) => {
  if (!$('#sheetBg').classList.contains('show')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (e.key !== 'Tab') return;
  const sheet = $('#sheet'), f = [...sheet.querySelectorAll('button')], a = document.activeElement;
  if (!f.length) { e.preventDefault(); sheet.focus(); return; }
  const first = f[0], last = f[f.length - 1];
  if (!sheet.contains(a) || a === sheet) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
  else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
});

// --- language -------------------------------------------------------------
function applyLang() {
  const h = document.documentElement; h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = L(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = L(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', L(el.dataset.i18nAria)); });
  const lb = $('#langTog');
  lb.textContent = lang === 'ar' ? 'EN' : 'ع';
  lb.setAttribute('aria-label', lang === 'ar' ? 'English' : 'العربية');
  lb.lang = lang === 'ar' ? 'en' : 'ar';
  paintTheme(); setStatus(statusOpen); renderIndex(); renderNote();
  if (loaded) render(); else $('#list').innerHTML = `<li class="muted">${esc(L('loading'))}</li>`;
}
$('#langTog').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  lsSet('ase_lang', lang);
  applyLang();
});

$('#themeTog').addEventListener('click', toggleTheme);
applyLang();
loadIndex(); loadList();
setInterval(loadIndex, 3000);
setInterval(() => { if (!$('#sheetBg').classList.contains('show')) loadList(); }, 3000);
// keep the tape live on tabs that don't fetch the full ticker
setInterval(() => { if (tab !== 'all' && tab !== 'watch') loadTape(); }, 3000);
// tick the "updated Ns ago" label between polls
setInterval(renderNote, 1000);
</script>
</body>
